<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title description">
  <title id="title">Gila Commerce modular monolith module interactions</title>
  <desc id="description">React client calls the Spring Boot API. Product, importing, cart, and order modules call one another through public services, share identity and shared concepts, persist to PostgreSQL, and use a bounded import executor and fake payment gateway.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1d3557" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#315a9e"/>
    </marker>
    <marker id="dashedArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#75849a"/>
    </marker>
    <style>
      .title { font: 700 36px Inter, Arial, sans-serif; fill: #17233a; }
      .subtitle { font: 500 17px Inter, Arial, sans-serif; fill: #5c6b82; }
      .section { font: 700 18px Inter, Arial, sans-serif; fill: #3a4b66; letter-spacing: 1px; }
      .module-title { font: 700 24px Inter, Arial, sans-serif; fill: #17233a; }
      .module-subtitle { font: 500 15px Inter, Arial, sans-serif; fill: #42526b; }
      .service { font: 600 14px Inter, Arial, sans-serif; fill: #2b3d57; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #52627a; }
      .label { font: 600 13px Inter, Arial, sans-serif; fill: #315a9e; }
      .label-muted { font: 600 13px Inter, Arial, sans-serif; fill: #66768d; }
      .external-title { font: 700 20px Inter, Arial, sans-serif; fill: #17233a; }
      .external-subtitle { font: 500 14px Inter, Arial, sans-serif; fill: #52627a; }
      .line { fill: none; stroke: #315a9e; stroke-width: 3; marker-end: url(#arrow); }
      .line-muted { fill: none; stroke: #75849a; stroke-width: 2.5; stroke-dasharray: 8 7; marker-end: url(#dashedArrow); }
      .pill { fill: #ffffff; stroke: #d9e2ef; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="#f7f9fc"/>

  <text x="900" y="65" text-anchor="middle" class="title">Gila Commerce — Module Interaction Design</text>
  <text x="900" y="95" text-anchor="middle" class="subtitle">Feature-oriented Spring Boot modular monolith · one local transaction boundary · PostgreSQL authoritative</text>

  <g filter="url(#shadow)">
    <rect x="52" y="455" width="190" height="145" rx="18" fill="#ffffff" stroke="#c9d6e8" stroke-width="2"/>
    <rect x="77" y="480" width="140" height="88" rx="10" fill="#edf4ff" stroke="#82a8da" stroke-width="2"/>
    <circle cx="91" cy="494" r="5" fill="#ef6b73"/>
    <circle cx="107" cy="494" r="5" fill="#f1c95a"/>
    <circle cx="123" cy="494" r="5" fill="#66bd8b"/>
    <path d="M97 533 h100" stroke="#8aa6c8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="180" cy="533" r="8" fill="none" stroke="#315a9e" stroke-width="3"/>
    <path d="M186 539 l11 11" stroke="#315a9e" stroke-width="3" stroke-linecap="round"/>
    <text x="147" y="625" text-anchor="middle" class="external-title">React client</text>
    <text x="147" y="648" text-anchor="middle" class="external-subtitle">Storefront + admin UI</text>
  </g>

  <path d="M242 528 H300" class="line"/>
  <rect x="234" y="492" width="105" height="26" rx="13" class="pill"/>
  <text x="286" y="510" text-anchor="middle" class="label">HTTP / JSON</text>

  <g filter="url(#shadow)">
    <rect x="300" y="135" width="1180" height="770" rx="28" fill="#ffffff" stroke="#aebed3" stroke-width="2.5"/>
  </g>
  <text x="338" y="177" class="section">SPRING BOOT MODULAR MONOLITH</text>
  <text x="1442" y="177" text-anchor="end" class="small">Java 21 · Spring Web MVC · JPA · Flyway</text>

  <g filter="url(#shadow)">
    <rect x="338" y="198" width="1104" height="82" rx="16" fill="#eaf2ff" stroke="#82a8da" stroke-width="2"/>
  </g>
  <text x="378" y="232" class="module-title">Web API</text>
  <text x="378" y="258" class="module-subtitle">Controllers validate requests → call application services → return DTOs / ProblemDetail</text>
  <rect x="1188" y="217" width="211" height="42" rx="21" fill="#ffffff" stroke="#a8bdd8" stroke-width="1.5"/>
  <text x="1294" y="243" text-anchor="middle" class="service">/api/v1 · one origin</text>

  <g filter="url(#shadow)">
    <rect x="348" y="330" width="270" height="190" rx="20" fill="#e9f3ff" stroke="#78a6d8" stroke-width="2"/>
  </g>
  <text x="378" y="370" class="module-title">product</text>
  <text x="378" y="398" class="module-subtitle">Catalog ownership</text>
  <text x="378" y="433" class="service">ProductService · SearchService</text>
  <text x="378" y="459" class="service">ProductQueryService · InventoryService</text>
  <text x="378" y="485" class="service">ProductImportUpsertService</text>
  <text x="378" y="509" class="small">products table · SKU/category rules</text>

  <g filter="url(#shadow)">
    <rect x="700" y="330" width="270" height="190" rx="20" fill="#f1edff" stroke="#a18bd7" stroke-width="2"/>
  </g>
  <text x="730" y="370" class="module-title">importing</text>
  <text x="730" y="398" class="module-subtitle">CSV submission + status</text>
  <text x="730" y="433" class="service">SubmissionService · ProcessingService</text>
  <text x="730" y="459" class="service">CSV parser · rejected row records</text>
  <text x="730" y="485" class="service">AFTER_COMMIT event listener</text>
  <text x="730" y="509" class="small">product_imports · product_import_errors</text>

  <g filter="url(#shadow)">
    <rect x="348" y="620" width="270" height="190" rx="20" fill="#eaf8f1" stroke="#70b58c" stroke-width="2"/>
  </g>
  <text x="378" y="660" class="module-title">cart</text>
  <text x="378" y="688" class="module-subtitle">Active cart + line items</text>
  <text x="378" y="723" class="service">CartService · CartCheckoutService</text>
  <text x="378" y="749" class="service">Checkout use-case orchestration</text>
  <text x="378" y="775" class="small">carts · cart_items</text>

  <g filter="url(#shadow)">
    <rect x="700" y="620" width="270" height="190" rx="20" fill="#fff4e7" stroke="#dda46b" stroke-width="2"/>
  </g>
  <text x="730" y="660" class="module-title">order</text>
  <text x="730" y="688" class="module-subtitle">Order snapshots + payment boundary</text>
  <text x="730" y="723" class="service">OrderQueryService · PaymentGateway</text>
  <text x="730" y="749" class="service">CustomerOrder · OrderItem snapshot</text>
  <text x="730" y="775" class="small">customer_orders · order_items</text>

  <g filter="url(#shadow)">
    <rect x="1088" y="330" width="315" height="125" rx="20" fill="#fff3f3" stroke="#d79191" stroke-width="2"/>
  </g>
  <text x="1118" y="370" class="module-title">identity</text>
  <text x="1118" y="399" class="service">CurrentUserProvider</text>
  <text x="1118" y="425" class="small">Demo external user subject · no users table</text>

  <g filter="url(#shadow)">
    <rect x="1088" y="490" width="315" height="125" rx="20" fill="#f4f6f9" stroke="#9eabba" stroke-width="2"/>
  </g>
  <text x="1118" y="530" class="module-title">shared</text>
  <text x="1118" y="559" class="service">Money · error model · API translation</text>
  <text x="1118" y="585" class="small">Used by all business modules</text>

  <g filter="url(#shadow)">
    <rect x="1088" y="650" width="315" height="125" rx="20" fill="#edf9fb" stroke="#77b9c7" stroke-width="2"/>
  </g>
  <text x="1118" y="690" class="module-title">config</text>
  <text x="1118" y="719" class="service">productImportExecutor</text>
  <text x="1118" y="745" class="small">Bounded single-thread async executor</text>

  <path d="M700 423 H620" class="line"/>
  <rect x="617" y="385" width="155" height="27" rx="13" class="pill"/>
  <text x="694" y="404" text-anchor="middle" class="label">upsert products</text>

  <path d="M483 620 V520" class="line"/>
  <rect x="499" y="551" width="155" height="27" rx="13" class="pill"/>
  <text x="576" y="570" text-anchor="middle" class="label">ProductQueryService</text>

  <path d="M700 708 H618" class="line"/>
  <rect x="580" y="669" width="156" height="27" rx="13" class="pill"/>
  <text x="658" y="688" text-anchor="middle" class="label">CartCheckoutService</text>

  <path d="M700 647 C652 602 653 521 618 478" class="line"/>
  <rect x="590" y="542" width="126" height="27" rx="13" class="pill"/>
  <text x="653" y="561" text-anchor="middle" class="label">InventoryService</text>

  <path d="M618 655 V300 H1060 Q1088 300 1088 330" class="line-muted"/>
  <path d="M970 655 H1035 V425 H1088" class="line-muted"/>
  <rect x="790" y="282" width="145" height="26" rx="13" class="pill"/>
  <text x="862" y="300" text-anchor="middle" class="label-muted">CurrentUserProvider</text>

  <path d="M1088 690 C1035 690 1040 495 970 495" class="line-muted"/>
  <rect x="975" y="568" width="153" height="26" rx="13" class="pill"/>
  <text x="1052" y="586" text-anchor="middle" class="label-muted">productImportExecutor</text>

  <g filter="url(#shadow)">
    <rect x="1535" y="412" width="208" height="190" rx="22" fill="#ffffff" stroke="#aebed3" stroke-width="2"/>
    <ellipse cx="1639" cy="450" rx="65" ry="22" fill="#e7edf6" stroke="#8194ac" stroke-width="2"/>
    <path d="M1574 450 v90 c0 12 29 22 65 22s65-10 65-22v-90" fill="#dfe8f3" stroke="#8194ac" stroke-width="2"/>
    <path d="M1574 495 c0 12 29 22 65 22s65-10 65-22" fill="none" stroke="#8194ac" stroke-width="2"/>
    <path d="M1574 535 c0 12 29 22 65 22s65-10 65-22" fill="none" stroke="#8194ac" stroke-width="2"/>
    <text x="1639" y="635" text-anchor="middle" class="external-title">PostgreSQL</text>
    <text x="1639" y="658" text-anchor="middle" class="external-subtitle">Authoritative database</text>
  </g>
  <path d="M1480 520 H1535" class="line"/>
  <rect x="1391" y="485" width="142" height="26" rx="13" class="pill"/>
  <text x="1462" y="503" text-anchor="middle" class="label">module-owned tables</text>

  <g filter="url(#shadow)">
    <rect x="1515" y="755" width="245" height="105" rx="20" fill="#fffaf0" stroke="#d7b374" stroke-width="2"/>
    <text x="1545" y="795" class="external-title">Fake PaymentGateway</text>
    <text x="1545" y="821" class="external-subtitle">Side-effect free demo adapter</text>
  </g>
  <path d="M970 790 C1110 862 1345 874 1515 810" class="line"/>
  <rect x="1177" y="839" width="183" height="26" rx="13" class="pill"/>
  <text x="1269" y="857" text-anchor="middle" class="label">authorize + idempotency key</text>

  <rect x="300" y="940" width="1180" height="105" rx="18" fill="#eef3f9" stroke="#cbd6e4" stroke-width="1.5"/>
  <circle cx="348" cy="978" r="7" fill="#315a9e"/>
  <text x="365" y="983" class="small">Solid arrows: synchronous calls through a module’s public service contract.</text>
  <circle cx="348" cy="1014" r="7" fill="#75849a"/>
  <text x="365" y="1019" class="small">Dashed arrows: identity/shared dependency, configuration, or asynchronous import dispatch. No module reaches into another module’s repository.</text>
</svg>
