services:
  api:
    build:
      context: ./ecommerce-api
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: h2
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 6

  client:
    build:
      context: ./ecommerce-client
      dockerfile: Dockerfile
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy