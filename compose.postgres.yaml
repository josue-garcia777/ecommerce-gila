services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ecommerce-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ecommerce}
      DB_USERNAME: ${POSTGRES_USER:-ecommerce}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-xs4FPEf0qOu/5XLNZz/TdsN/sYUsOTgitDKJ6PKM1PM=} ##NOTE: just for demo
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-josue@gmail.com} 
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-123456789}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ecommerce-postgres-data: